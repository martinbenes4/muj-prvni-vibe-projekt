<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tracker návyků</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: "class" };
    </script>
    <script>
      (function () {
        try {
          const theme = localStorage.getItem("habit-tracker-theme");
          const dark =
            theme === "dark" ||
            (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch {
          /* uložení motivu není dostupné */
        }
      })();
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="min-h-screen text-slate-800 antialiased dark:text-slate-100">
    <main class="mx-auto flex min-h-screen w-full max-w-xl flex-col px-4 py-10 sm:px-6">
      <header class="mb-8 flex items-start justify-between gap-4">
        <div>
          <p id="day-kind" class="text-sm font-medium uppercase tracking-wide text-teal-700 dark:text-teal-300">Dnes</p>
          <h1 class="mt-1 text-3xl font-semibold tracking-tight text-slate-900 dark:text-white">Tracker návyků</h1>
          <p id="today-label" class="mt-2 text-slate-500 dark:text-slate-400"></p>
          <p id="sync-status" class="mt-1 hidden text-sm text-rose-700 dark:text-rose-300"></p>
        </div>
        <div class="flex shrink-0 items-center gap-2">
          <button
            id="auth-open"
            type="button"
            class="rounded-xl bg-teal-700 px-3 py-2 text-sm font-semibold text-white hover:bg-teal-800 focus:outline-none focus:ring-2 focus:ring-teal-600 focus:ring-offset-2"
          >
            Přihlásit
          </button>
          <p id="auth-email" class="hidden max-w-32 truncate text-sm text-slate-500 dark:text-slate-400"></p>
          <button
            id="auth-logout"
            type="button"
            class="hidden rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-teal-600 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100 dark:hover:bg-slate-800"
          >
            Odhlásit
          </button>
        <button
          id="theme-toggle"
          type="button"
          role="switch"
          aria-checked="false"
          aria-label="Přepnout na tmavý režim"
          class="relative h-9 w-16 shrink-0 rounded-full bg-slate-200 transition focus:outline-none focus:ring-2 focus:ring-teal-600 focus:ring-offset-2 dark:bg-slate-700 dark:focus:ring-offset-slate-950"
        >
          <span class="sr-only">Tmavý režim</span>
          <span
            class="theme-knob pointer-events-none absolute top-1 grid h-7 w-7 place-items-center rounded-full bg-white shadow dark:bg-slate-900"
          >
            <svg class="h-4 w-4 text-amber-500 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
            </svg>
            <svg class="hidden h-4 w-4 text-indigo-200 dark:block" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3a7 7 0 0 0 11.5 11.5z"></path>
            </svg>
          </span>
        </button>
        </div>
      </header>

      <div id="auth-modal" class="mb-6" role="dialog" aria-modal="true" aria-labelledby="auth-title">
        <form id="auth-form" class="w-full max-w-sm rounded-2xl bg-white p-5 shadow-xl ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-700">
          <h2 id="auth-title" class="text-xl font-semibold text-slate-900 dark:text-white">Přihlášení</h2>
          <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Stejný účet otevře návyky i na dalším zařízení.</p>
          <button
            id="auth-google"
            type="button"
            class="mt-4 flex w-full items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-semibold text-slate-800 hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100 dark:hover:bg-slate-700"
          >
            <svg class="h-5 w-5" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h6.5a5.6 5.6 0 0 1-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.7z"></path>
              <path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.2-4 1.2-3.1 0-5.7-2.1-6.6-4.9H1.4v3.1A12 12 0 0 0 12 24z"></path>
              <path fill="#FBBC05" d="M5.4 14.4A7.2 7.2 0 0 1 5 12c0-.8.1-1.6.4-2.4V6.5H1.4A12 12 0 0 0 0 12c0 1.9.5 3.8 1.4 5.5l4-3.1z"></path>
              <path fill="#EA4335" d="M12 4.8c1.7 0 3.3.6 4.5 1.8l3.4-3.4A12 12 0 0 0 1.4 6.5l4 3.1C6.3 6.9 8.9 4.8 12 4.8z"></path>
            </svg>
            Přihlásit přes Google
          </button>
          <p id="auth-message" class="mt-3 hidden rounded-xl px-3 py-2 text-sm" role="status"></p>
          <div class="hidden">
          <p class="mt-4 text-center text-xs font-medium uppercase tracking-wide text-slate-400">nebo e-mailem</p>
          <label class="mt-4 block text-sm font-medium text-slate-700 dark:text-slate-200" for="auth-email-input">E-mail</label>
          <input
            id="auth-email-input"
            type="email"
            autocomplete="username"
            class="mt-1 w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-base text-slate-900 outline-none ring-teal-600 focus:bg-white focus:ring-2 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100"
          />
          <label class="mt-3 block text-sm font-medium text-slate-700 dark:text-slate-200" for="auth-password-input">Heslo</label>
          <input
            id="auth-password-input"
            type="password"
            autocomplete="current-password"
            minlength="6"
            class="mt-1 w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-base text-slate-900 outline-none ring-teal-600 focus:bg-white focus:ring-2 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100"
          />
          <div class="mt-4 flex flex-wrap gap-2">
            <button type="submit" class="rounded-xl bg-teal-700 px-4 py-3 text-sm font-semibold text-white hover:bg-teal-800">Přihlásit</button>
            <button id="auth-register" type="button" class="rounded-xl border border-slate-200 px-4 py-3 text-sm font-medium text-slate-700 hover:bg-slate-50 dark:border-slate-700 dark:text-slate-100 dark:hover:bg-slate-800">Vytvořit účet</button>
          </div>
          </div>
        </form>
      </div>

      <div id="app-shell" class="hidden">
      <section class="mb-6 rounded-2xl bg-white p-4 shadow-sm ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-700">
        <div class="flex flex-wrap items-center gap-2">
          <button
            id="date-prev"
            type="button"
            class="rounded-xl border border-slate-200 bg-slate-50 px-3 py-3 text-sm font-medium text-slate-700 hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-teal-600 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100 dark:hover:bg-slate-700"
          >
            Dříve
          </button>
          <button
            id="date-display"
            type="button"
            class="min-w-0 flex-1 rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-base font-medium text-slate-900 outline-none ring-teal-600 hover:bg-white focus:ring-2 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100 dark:hover:bg-slate-800"
          >
            Datum
          </button>
          <input id="selected-date" type="date" class="sr-only" tabindex="-1" />
          <button
            id="date-next"
            type="button"
            class="rounded-xl border border-slate-200 bg-slate-50 px-3 py-3 text-sm font-medium text-slate-700 hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-teal-600 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100 dark:hover:bg-slate-700"
          >
            Později
          </button>
          <button
            id="date-today"
            type="button"
            class="hidden rounded-xl bg-teal-700 px-3 py-3 text-sm font-semibold text-white hover:bg-teal-800 focus:outline-none focus:ring-2 focus:ring-teal-600 focus:ring-offset-2"
          >
            Dnes
          </button>
        </div>
        <p id="date-hint" class="mt-3 text-sm text-slate-500 dark:text-slate-400"></p>
      </section>

      <section class="mb-6 rounded-2xl bg-white p-4 shadow-sm ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-700">
        <form id="habit-form" class="flex flex-col gap-3">
          <div class="flex gap-2">
            <label class="sr-only" for="habit-name">Název události</label>
            <input
              id="habit-name"
              name="name"
              type="text"
              maxlength="80"
              required
              placeholder="Nová událost, například schůzka"
              class="min-w-0 flex-1 rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-base text-slate-900 outline-none ring-teal-600 placeholder:text-slate-400 focus:bg-white focus:ring-2 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100 dark:placeholder:text-slate-500 dark:focus:bg-slate-800"
            />
            <button
              type="submit"
              class="shrink-0 rounded-xl bg-teal-700 px-4 py-3 text-sm font-semibold text-white transition hover:bg-teal-800 focus:outline-none focus:ring-2 focus:ring-teal-600 focus:ring-offset-2"
            >
              Přidat
            </button>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <button
              id="time-start"
              type="button"
              class="flex items-center justify-between rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-left outline-none ring-teal-600 focus:ring-2 dark:border-slate-700 dark:bg-slate-800"
            >
              <span class="text-sm text-slate-500 dark:text-slate-400">Od</span>
              <span id="time-start-value" class="text-lg font-semibold tabular-nums text-slate-900 dark:text-slate-100"></span>
            </button>
            <button
              id="time-end"
              type="button"
              class="flex items-center justify-between rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-left outline-none ring-teal-600 focus:ring-2 dark:border-slate-700 dark:bg-slate-800"
            >
              <span class="text-sm text-slate-500 dark:text-slate-400">Do</span>
              <span id="time-end-value" class="text-lg font-semibold tabular-nums text-slate-900 dark:text-slate-100"></span>
            </button>
          </div>
          <div
            id="time-picker"
            hidden
            class="rounded-2xl bg-slate-50 p-3 ring-1 ring-slate-200 dark:bg-slate-800 dark:ring-slate-700"
          >
            <div class="flex items-end justify-between gap-3">
              <p id="time-picker-title" class="text-sm font-medium uppercase tracking-wide text-teal-700 dark:text-teal-300"></p>
              <p id="time-picker-preview" class="text-3xl font-semibold tabular-nums tracking-tight text-slate-900 dark:text-white"></p>
            </div>
            <p class="mt-3 text-xs font-medium uppercase tracking-wide text-slate-500 dark:text-slate-400">Hodina</p>
            <div id="hour-grid" class="mt-2 grid grid-cols-6 gap-1"></div>
            <p class="mt-3 text-xs font-medium uppercase tracking-wide text-slate-500 dark:text-slate-400">Minuta</p>
            <div id="minute-grid" class="mt-2 grid grid-cols-6 gap-1"></div>
          </div>
          <p id="time-error" class="hidden text-sm text-rose-700 dark:text-rose-300"></p>
        </form>
      </section>

      <section
        id="timeline-section"
        class="mb-6 hidden rounded-2xl bg-white p-4 shadow-sm ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-700"
      >
        <h2 class="mb-4 text-sm font-medium text-slate-700 dark:text-slate-200">Časová osa</h2>
        <div id="timeline-clock" class="flex gap-3">
          <div id="timeline-hours" class="relative w-12 shrink-0" aria-hidden="true"></div>
          <ol id="timeline-track" class="relative min-w-0 flex-1"></ol>
        </div>
        <ul id="timeline-untimed" class="mt-3 flex flex-col gap-2"></ul>
      </section>

      <section class="mb-4 flex items-center justify-between text-sm">
        <h2 id="list-heading" class="font-medium text-slate-700 dark:text-slate-200">Dnešní události</h2>
        <p id="progress-label" class="text-slate-500 dark:text-slate-400"></p>
      </section>

      <ul id="habit-list" class="flex flex-col gap-3"></ul>

      <p
        id="empty-state"
        class="hidden rounded-2xl border border-dashed border-slate-300 bg-white/70 px-6 py-10 text-center text-slate-500 dark:border-slate-700 dark:bg-slate-900/70 dark:text-slate-400"
      >
        V tento den zatím nic není. Přidej událost.
      </p>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
    <script src="app.js?v=6"></script>
  </body>
</html>
